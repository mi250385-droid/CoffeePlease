<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>THIS_IS_PEAK</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <header class="hero">
            <p class="eyebrow">✨Winter Magic✨</p>
        <h1>My BOOTIFUL snowglobe</h1>
        <p class="tagline">Shake it for a little winter kindness</p>
        </header>
        <main>
            <section class="globe-card">
            <div class="globe" id="globe">
                <div class="glow"></div>
                <img class="scene" src="snowglobe.png" alt="a snowglobe" />
            </div>
            <button id="shake">✨shake the globe✨</button>
            <p class="message" id="message">press the button and see what settles</p>
        </section>
        </main>
        <footer>
            <p>♡ Made by me, in the snow ♡</p>
        </footer>
        <script src="script.js"></script>

    </body>
</html>
